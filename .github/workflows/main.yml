name: Release Creation

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: npm ci

    - name: Build Packs
      run: |
        npm run repack --if-present

    # Substitute the Manifest and Download URLs in the module.json
    - name: Substitute Manifest and Download Links For Versioned Ones
      id: sub_manifest_link_version
      uses: microsoft/variable-substitution@v1
      with:
        files: 'module.json'
      env:
        version: ${{github.event.release.tag_name}}
        url: https://github.com/${{github.repository}}
        manifest: https://github.com/${{github.repository}}/releases/latest/download/module.json
        download: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.zip

    #

    # Create a zip file with all files required by the module to add to the release
    - name: Create Module Zip
      run: zip -r ./module.zip module.json images/ packs/ assets/ scripts/

    # Create a release for this specific version
    - name: Update Release with Files
      id: create_version_release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true # Set this to false if you want to prevent updating existing releases
        name: ${{ github.event.release.name }}
        draft: ${{ github.event.release.unpublished }}
        prerelease: ${{ github.event.release.prerelease }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: './module.json, ./module.zip'
        tag: ${{ github.event.release.tag_name }}
        body: ${{ github.event.release.body }}

  notify-discord:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
    # Posts directly to the Discord webhook (instead of using an action) so the
    # embed title is plain text with no link back to the GitHub release.
    - name: Post Release to Discord
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        RELEASE_NAME: ${{ github.event.release.name }}
        RELEASE_BODY: ${{ github.event.release.body }}
        RELEASE_DATE: ${{ github.event.release.published_at }}
      run: |
        python3 <<'PYEOF'
        import json
        import os
        import urllib.request
        from datetime import datetime

        release_date = datetime.fromisoformat(os.environ["RELEASE_DATE"].replace("Z", "+00:00"))
        date_str = f'{release_date:%b} {release_date.day} {release_date:%Y}'
        title = f'{os.environ["RELEASE_NAME"]} ({date_str})'

        payload = {
            "username": "Covalon Module Changelog",
            "avatar_url": "https://cdn.discordapp.com/avatars/1076881817472335982/ef4c79ed8b79adf4b67d6089420f6726.webp",
            "embeds": [
                {
                    "title": title,
                    "description": os.environ["RELEASE_BODY"][:4096],
                    "color": 12096090,
                }
            ],
        }

        req = urllib.request.Request(
            os.environ["WEBHOOK_URL"],
            data=json.dumps(payload).encode("utf-8"),
            headers={
                "Content-Type": "application/json",
                "User-Agent": "Mozilla/5.0 (compatible; CovalonReleaseBot/1.0)",
            },
            method="POST",
        )
        try:
            with urllib.request.urlopen(req) as resp:
                print(f"Discord webhook responded with status {resp.status}")
        except urllib.error.HTTPError as err:
            print(f"Discord webhook error {err.code}: {err.read().decode('utf-8', 'replace')}")
            raise
        PYEOF
