name: Release Creation

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: npm ci

    - name: Build Packs
      run: |
        npm run repack --if-present

    # Substitute the Manifest and Download URLs in the module.json
    - name: Substitute Manifest and Download Links For Versioned Ones
      id: sub_manifest_link_version
      uses: microsoft/variable-substitution@v1
      with:
        files: 'module.json'
      env:
        version: ${{github.event.release.tag_name}}
        url: https://github.com/${{github.repository}}
        manifest: https://github.com/${{github.repository}}/releases/latest/download/module.json
        download: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.zip

    #

    # Create a zip file with all files required by the module to add to the release
    - name: Create Module Zip
      run: zip -r ./module.zip module.json images/ packs/ assets/ scripts/

    # Create a release for this specific version
    - name: Update Release with Files
      id: create_version_release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true # Set this to false if you want to prevent updating existing releases
        name: ${{ github.event.release.name }}
        draft: ${{ github.event.release.unpublished }}
        prerelease: ${{ github.event.release.prerelease }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: './module.json, ./module.zip'
        tag: ${{ github.event.release.tag_name }}
        body: ${{ github.event.release.body }}

    # Format the release date for the Discord embed footer (e.g. "Sep 10 2026")
    - name: Format Release Date
      id: release_date
      run: echo "date=$(date -u -d '${{ github.event.release.published_at }}' +'%b %-d %Y')" >> "$GITHUB_OUTPUT"

    # Only runs if the release step above succeeded
    - name: GitHub Releases to Discord
      uses: SethCohen/github-releases-to-discord@v1
      with:
        webhook_url: ${{ secrets.WEBHOOK_URL }}
        color: "12096090"
        username: "Covalon Module Changelog"
        avatar_url: "https://cdn.discordapp.com/avatars/1076881817472335982/ef4c79ed8b79adf4b67d6089420f6726.webp"
        reduce_headings: true
        footer_timestamp: true