name: Valexxia, the Flesh Crafter
type: deity
effects: []
system:
  description:
    gm: ''
    value: >-
      <p>Once a mortal priestess renowned for her medical prowess, her practice
      became an obsession after the loss of a loved one. An intrigue into
      physiology and how to enhance, preserve, or renew a mortal’s condition
      grew, until she began incorporating darker magic to achieve the results
      she longed for. Shortly thereafter she was excommunicated from society
      with a penance of death, her eagerness and inquisitive ambition propelling
      her forward until obtaining a deific status. Referred to as crazy,
      delusional or unnatural; her mentality barricaded the negative inquiries
      in order to pave the way for self-preservation. She transfigured her own
      form beyond the commonly perceived mortal shackles, standing as a beacon
      for others pursuing transcendence.</p><p><strong>Edicts</strong> Encourage
      the development or mutation of physiology, embrace grief or pain as
      constructive lessons, delight in the freedom of not being in
      control</p><p><strong>Anathema</strong> Speak of sorrow or pain in a
      negative way, discriminate based on physical appearance, curb your
      research due to other’s opinions.</p>
