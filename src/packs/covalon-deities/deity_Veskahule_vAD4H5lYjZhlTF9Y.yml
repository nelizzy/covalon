system:
  description:
    gm: ''
    value: >-
      <p>As the essence of dreams and nightmares flowed from the Material Plane
      into the Astral Plane, they coalesced into the form of a massive worm. The
      wants, thoughts, and wishes of innumerable living creatures gave birth to
      a creature of insatiable appetite for change. As time passed, its power
      grew, and the nameVeskahule spread throughout the planes. Those that
      struggle to interpret their dreams pray to it, seeking guidance on how to
      proceed with gifted and unforeseen knowledge. Those that praise change or
      decide fate through their own interpretation will seek it out in hopes of
      a better future.</p><p><strong>Edicts</strong> Assist in making dreams or
      nightmares become reality, encourage the manifestation of new ideas or
      growth, make efforts to decide your own fate and allow dreams or
      nightmares to guide you</p><p><strong>Anathema</strong> Willingly
      relinquish your fate to someone else, dismiss dreams and nightmares as
      invaluable, discourage growth or change in any aspect.</p>
