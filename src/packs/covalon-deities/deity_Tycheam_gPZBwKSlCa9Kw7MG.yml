system:
  description:
    gm: ''
    value: >-
      <p>Everything has one true place in the Universe and the tapestry of fate.
      Even if despair spreads, hope will resurface. There is no need to get
      anxious, for everything will fall into place one day. And with a bit of
      luck, that day may be today.” These are the core Tycheamian beliefs. The
      true nature of Tycheam, whether a deity, philosophy, or a powerful but
      lazy seer, has been lost to time. Similarly, the freedom of interpretation
      — or rather lack of direction regarding how one should find their true
      place has led to numerous, sometimes violent clashes within the faith.
      Nevertheless, free from the shackles of fear and despair, its followers
      can withstand adversity with a serene face radiating light, Tycheam’s
      symbol. Among those who have perfected their sleep schedule, a select few
      can experience short, vague yet vivid visions amidst a dream. A glimpse at
      one’s fate that can be planned around, but shouldn’t be avoided. In fact,
      “let your fate go” is a common Tycheamian saying.</p><p>Some may think
      Tycheam is nothing but soothing little lies, inviting complacency, but
      even a fairy tale can become real if one believes strongly. There is no
      need to worry. Everything will be alright.</p><p><strong>Edicts</strong>
      seek what you’re good at and reassure your allies when necessary, live in
      the moment and trust the process, sleep as long and as regularly as is
      reasonable each day</p><p><strong>Anathema</strong> refuse to accept one’s
      fate, worry endlessly about what you can’t control, mess up your sleep
      schedule for trivial matters, rush the process</p>
